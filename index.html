<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anjuna MIDI Generator for Ableton Live 10</title>
<style>
  :root {
    --bg: #0d1017; --panel: #151a24; --panel2: #1b2230; --line: #283142;
    --text: #e6eaf2; --muted: #93a0b5; --accent: #6ea8ff; --accent2: #5ce1c2;
    --danger: #ff6b81; --radius: 10px;
    --c-chords: #7c9cff; --c-bass: #ff8a5c; --c-kick: #ff5c7a; --c-drums: #ffd166; --c-pattern: #5ce1c2;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  h2 { font-size: 15px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
  button, select, input, textarea { font: inherit; color: var(--text); }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08101f; font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button[aria-pressed="true"] { background: #22304a; border-color: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  select, input[type="number"], input[type="text"], input[type="search"], textarea {
    background: #0f141d; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
  .field label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field output { color: var(--text); }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .seedrow { display: flex; gap: 6px; }
  .seedrow input { flex: 1; min-width: 0; }
  .filters { display: grid; gap: 10px; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chiprow .lbl { font-size: 12px; color: var(--muted); min-width: 86px; }
  .chip { border-radius: 999px; padding: 4px 11px; font-size: 12px; }
  .parts { display: grid; gap: 14px; }
  .part { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--pc, var(--accent)); border-radius: var(--radius); padding: 12px; }
  .part-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .part-head h3 { margin: 0; font-size: 16px; color: var(--pc); min-width: 90px; }
  .part-head select { width: auto; min-width: 170px; }
  .part-head .spacer { flex: 1; }
  .part-body { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 900px) { .part-body { grid-template-columns: 1fr; } }
  canvas.roll { width: 100%; height: 170px; display: block; background: #0a0d13; border: 1px solid var(--line); border-radius: 8px; }
  .part-info { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 18px; word-break: break-word; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
  .card h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tag { background: #0f141d; border: 1px solid var(--line); color: var(--pc, var(--accent2)); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  .card dl { margin: 0; display: grid; grid-template-columns: 82px 1fr; gap: 4px 8px; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; }
  .lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
  .lib button { text-align: left; padding: 10px 12px; display: block; width: 100%; height: 100%; }
  .lib .n { font-weight: 600; display: block; }
  .lib .m { font-size: 12px; color: var(--muted); display: block; margin: 2px 0 6px; }
  .lib .tags { margin: 0; }
  .empty { color: var(--muted); font-style: italic; }
  details summary { cursor: pointer; color: var(--muted); }
  details[open] summary { margin-bottom: 8px; }
  textarea { min-height: 260px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
  .status { font-size: 12px; color: var(--accent2); min-height: 18px; margin: 4px 0 10px; }
  .status.err { color: var(--danger); }
  .help ol, .help ul { margin: 6px 0 6px 20px; padding: 0; }
  .help li { margin: 3px 0; }
  .sr { position: absolute; left: -9999px; }
  .keyinfo { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent2); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 14px; }
  .keyinfo strong { font-size: 16px; color: var(--accent2); margin-right: 8px; }
  .keyinfo .kn { display: inline-flex; gap: 4px; flex-wrap: wrap; vertical-align: middle; margin: 0 6px; }
  .keyinfo .kn span { background: #0f141d; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-weight: 600; }
  .keyinfo p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  canvas.roll { touch-action: none; cursor: crosshair; }
  .edit-hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .chordstrip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chordbtn { text-align: left; padding: 5px 9px; line-height: 1.25; }
  .chordbtn .cr { display: block; font-size: 10px; color: var(--muted); }
  .chordbtn .cn { display: block; font-weight: 700; color: var(--pc); }
  .chordbtn .cv { display: block; font-size: 11px; color: var(--text); }
  .chordbtn.edited { border-style: dashed; border-color: var(--accent2); }
  .chordedit { flex-basis: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
  .chordedit .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chordedit label { font-size: 12px; color: var(--muted); }
  .chordedit select { width: auto; }
  .device { margin-bottom: 8px; }
  .device strong { color: var(--pc); font-size: 13.5px; }
  .card h5 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .fxlist { margin: 0; padding-left: 18px; }
  .fxlist li { margin: 3px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span data-i18n="title"></span><small data-i18n="subtitle"></small></h1>
    <div class="toolbar" role="toolbar" aria-label="Main actions">
      <button id="btnGenerate" class="primary" data-i18n="generateAll"></button>
      <button id="btnPlayAll" aria-pressed="false" data-i18n="playAll"></button>
      <button id="btnExportAll" data-i18n="exportAll"></button>
      <button id="btnExportCombined" data-i18n="exportCombined"></button>
    </div>
  </header>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section class="panel" aria-labelledby="hSettings">
    <h2 id="hSettings" data-i18n="settings"></h2>
    <div class="controls" id="controls"></div>
  </section>

  <section class="panel" aria-labelledby="hFilters">
    <h2 id="hFilters" data-i18n="filters"></h2>
    <div class="filters">
      <div class="chiprow" id="chipsGenre" role="group"></div>
      <div class="chiprow" id="chipsArtist" role="group"></div>
      <div class="chiprow" id="chipsPart" role="group"></div>
      <div class="chiprow">
        <label class="lbl" for="search" data-i18n="search"></label>
        <input type="search" id="search" style="max-width:340px">
        <button id="btnClearFilters" data-i18n="clearFilters"></button>
      </div>
    </div>
  </section>

  <section aria-labelledby="hParts">
    <h2 id="hParts" data-i18n="parts"></h2>
    <div id="keyInfo" class="keyinfo" aria-live="polite"></div>
    <div class="parts" id="parts"></div>
    <p class="empty" id="partsEmpty" hidden data-i18n="partsHidden"></p>
  </section>

  <section class="panel" aria-labelledby="hLibrary" style="margin-top:14px">
    <h2 id="hLibrary" data-i18n="library"></h2>
    <div class="lib" id="library"></div>
    <p class="empty" id="libEmpty" hidden data-i18n="libEmpty"></p>
  </section>

  <section class="panel">
    <details>
      <summary data-i18n="artistJson"></summary>
      <p class="hint" data-i18n="artistJsonHint" style="color:var(--muted);font-size:12px"></p>
      <label class="sr" for="artistJsonText" data-i18n="artistJson"></label>
      <textarea id="artistJsonText" spellcheck="false"></textarea>
      <div class="toolbar" style="margin-top:8px">
        <button id="btnApplyJson" data-i18n="applyJson"></button>
        <button id="btnResetJson" data-i18n="resetJson"></button>
      </div>
    </details>
  </section>

  <section class="panel help">
    <details>
      <summary data-i18n="helpTitle"></summary>
      <div id="help"></div>
    </details>
  </section>
</div>

    });
    // grid: beats and bars (beats are skipped when the clip is long)
    var beats = total / PPQ;
    for (i = 0; i <= beats; i++) {
      var bar = i % 4 === 0;
      if (!bar && beats > 64) continue;
      g.fillStyle = bar ? '#34405a' : '#1c2433';
      g.fillRect(gut + Math.round(i / beats * pw), 0, 1, h);
    }
    g.fillStyle = PARTS[pid].color;
    notes.forEach(function (n) {
      var r = rowOf[n.pitch];
      if (r === undefined) return;
      g.globalAlpha = 0.4 + 0.6 * n.vel / 127;
      var x = gut + n.start / total * pw, nw = Math.max(1.5, n.dur / total * pw - 0.5);
      g.fillRect(x, r * rh + 0.5, nw, Math.max(1, rh - 1));
      if (!PARTS[pid].drum && rh >= 9 && nw >= 22) { // note name inside the note
        g.globalAlpha = 1; g.fillStyle = '#0a0d13'; g.fillText(liveNoteName(n.pitch, flats), x + 3, r * rh + rh / 2 + 0.5); g.fillStyle = PARTS[pid].color;
      }
    });
    g.globalAlpha = 1;
    if (state.sel && state.sel.pid === pid && rowOf[state.sel.note.pitch] !== undefined) {
      var sn = state.sel.note;
      g.strokeStyle = '#ffffff'; g.lineWidth = 1.5;
      g.strokeRect(gut + sn.start / total * pw - 1, rowOf[sn.pitch] * rh, Math.max(4, sn.dur / total * pw + 1.5), rh);
    }
    if (playFrac >= 0) { g.fillStyle = '#ffffff'; g.fillRect(gut + playFrac * pw, 0, 1.5, h); }
  }
  function drawAll() { PART_IDS.forEach(function (pid) { drawRoll(pid, -1); }); }

  /* ---- playback ---- */
  function startPlayback(pids) {
    var song = state.song, spt = 60 / (song.cfg.bpm * PPQ), events = [];
    pids.forEach(function (pid) {
      song.parts[pid].notes.forEach(function (n) {
        events.push({ t: n.start * spt, dur: n.dur * spt, pitch: n.pitch, vel: n.vel / 127, voice: PARTS[pid].voice || pid });
      });
    });
    events.sort(function (a, b) { return a.t - b.t; });
    var ok = player.play(events, song.ctx.total * spt, function () { state.playing = []; syncPlayButtons(); drawAll(); });
    if (!ok) { setStatus(STR.noAudio, true); return; }
    state.playing = pids.slice();
    syncPlayButtons();
    (function frame() {
      if (!player.isPlaying()) return;
      var pos = player.position();
      state.playing.forEach(function (pid) { drawRoll(pid, pos); });
      window.requestAnimationFrame(frame);
    })();
  }
  function togglePlay(pids) {
    var same = player.isPlaying() && state.playing.join() === pids.join();
    player.stop();
    if (!same) startPlayback(pids);
  }
  function syncPlayButtons() {
    var all = state.playing.length === PART_IDS.length;
    PART_IDS.forEach(function (pid) {
      var on = !all && state.playing.indexOf(pid) >= 0, b = ui.parts[pid].play;
      b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.textContent = on ? STR.stop : STR.play;
    });
    $('btnPlayAll').setAttribute('aria-pressed', all ? 'true' : 'false');
    $('btnPlayAll').textContent = all ? STR.stop : STR.playAll;
  }

  /* ---- export ---- */
  function fileBase() {
    var s = state.s, a = artistById(s.artist);
    return ['anjuna', a ? a.id : s.genre, keyInfo(s.key, s.scale).tonic.replace('#', 's') + s.scale, s.bpm + 'bpm', s.bars + 'bars', 'seed' + String(s.seed).replace(/[^\w-]/g, '')].join('_');
  }
  function download(bytes, name) {
    var url = URL.createObjectURL(new Blob([bytes], { type: 'audio/midi' }));
    var a = el('a', { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    setStatus(fmt(STR.exported, { name: name }));
  }
  function exportPart(pid) { download(midiForPart(state.song, pid), fileBase() + '_' + pid + '.mid'); }

  /* ---- library + artist JSON ---- */
  function loadPreset(p) {
    var s = state.s;
    if (p.artist && artistById(p.artist)) applyArtist(p.artist); else applyGenreDefaults(p.genre);
    ['key', 'scale', 'bars', 'bpm', 'swing', 'complexity', 'energy', 'humanize'].forEach(function (k) { if (p[k] !== undefined) s[k] = p[k]; });
    s.seed = String(p.seed);
    PART_IDS.forEach(function (pid) { state.styles[pid] = (p.styles && p.styles[pid]) || 'auto'; });
    resetVars(); syncControls(); generate(false);
    setStatus(fmt(STR.loaded, { name: p.name }));
    $('hParts').scrollIntoView();
  }
  function buildLibrary() {
    var host = $('library');
    while (host.firstChild) host.removeChild(host.firstChild);
    ui.lib = LIBRARY.map(function (p) {
      var a = p.artist ? artistById(p.artist) : null;
      var meta = (a ? a.name + ' · ' : '') + STR.genres[p.genre] + ' · ' + keyInfo(p.key, p.scale).tonic + ' ' + STR.scales[p.scale] + ' · ' + p.bars + ' ' + STR.bars.toLowerCase();
      var node = el('button', { type: 'button', onclick: function () { loadPreset(p); } }, [
        el('span', { class: 'n', text: p.name }), el('span', { class: 'm', text: meta }),
        el('span', { class: 'tags' }, p.tags.map(function (t) { return el('span', { class: 'tag', text: t }); }))
      ]);
      host.appendChild(node);
      return { preset: p, node: node };
    });
  }
  function refreshArtists(list, persist) {
    state.artists = list;
    if (!artistById(state.s.artist)) state.s.artist = '';
    $('artistJsonText').value = JSON.stringify(list, null, 2);
    if (persist) { try { window.localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch (err) { /* private mode */ } }
    buildChips(); buildLibrary(); syncControls(); generate(false);
  }

  /* ---- wiring ---- */
  buildControls(); buildParts(); buildLibrary(); buildChips();
  $('artistJsonText').value = JSON.stringify(state.artists, null, 2);
  $('btnGenerate').addEventListener('click', function () { generate(); });
  $('btnPlayAll').addEventListener('click', function () { togglePlay(PART_IDS.slice()); });
  $('btnExportAll').addEventListener('click', function () {
    PART_IDS.forEach(function (pid, i) { setTimeout(function () { exportPart(pid); }, i * 300); });
  });
  $('btnExportCombined').addEventListener('click', function () { download(midiCombined(state.song), fileBase() + '_multitrack.mid'); });
  $('search').addEventListener('input', function (ev) { state.filters.q = ev.target.value; applyFilters(); });
  $('btnClearFilters').addEventListener('click', function () {
    state.filters = { genres: {}, artists: {}, parts: {}, q: '' };
    $('search').value = ''; buildChips(); applyFilters();
  });
  $('btnApplyJson').addEventListener('click', function () {
    try { refreshArtists(validateArtistPresets(JSON.parse($('artistJsonText').value)), true); setStatus(STR.jsonOk); }
    catch (err) { setStatus(STR.jsonErr + err.message, true); }
  });
  $('btnResetJson').addEventListener('click', function () {
    try { window.localStorage.removeItem(STORE_KEY); } catch (err) { /* ignore */ }
    refreshArtists(JSON.parse(JSON.stringify(DEFAULT_ARTIST_PRESETS)), false); setStatus(STR.jsonOk);
  });
  window.addEventListener('resize', drawAll);
  syncControls(); generate();
}

/* =====================================================================
 * 10. SELF-TESTS — run runTests() in the browser console
 * ===================================================================== */
function runTests() {
  var results = [], fails = [];
  var check = function (name, ok, detail) {
    results.push({ test: name, ok: !!ok });
    if (!ok && fails.length < 25) fails.push(name + (detail ? ' — ' + detail : ''));
  };
  var baseCfg = function (o) {
    return Object.assign({ genre: 'melodic', artistPreset: null, key: 9, scale: 'min', bpm: 123, bars: 8, swing: 54, complexity: 60,
      energy: 70, humanize: 100, seed: 'test', styles: {}, vars: {} }, o);
  };
  var sig = function (song) { return JSON.stringify(PART_IDS.map(function (p) { return song.parts[p].notes; })); };
  var drumPitches = Object.keys(DRUM).map(function (k) { return DRUM[k]; });
  var combos = 0, bad = { scale: 0, range: 0, loop: 0, overlap: 0, empty: 0, midi: 0, lastBar: 0 }, first = {};
  var note = function (k, d) { bad[k]++; if (!first[k]) first[k] = d; };

  function verify(song, label) {
    var cfg = song.cfg, total = cfg.bars * BAR, allowed = allowedPcs(cfg.key, cfg.scale);
    PART_IDS.forEach(function (pid) {
      var notes = song.parts[pid].notes, P = PARTS[pid], by = {}, where = label + '/' + pid + ':' + song.parts[pid].style;
      if (!notes.length) note('empty', where);
      if (!notes.some(function (n) { return n.start + n.dur > total - BAR + 20; })) note('lastBar', where);
      notes.forEach(function (n) {
        if (n.start < 0 || n.dur <= 0 || n.start + n.dur > total) note('loop', where);
        if (pid === 'kick' ? n.pitch !== 36 : P.drum ? drumPitches.indexOf(n.pitch) < 0 : (n.pitch < P.lo || n.pitch > P.hi)) note('range', where + ' pitch ' + n.pitch);
        if (!P.drum && allowed.indexOf(n.pitch % 12) < 0) note('scale', where + ' pitch ' + n.pitch);
        var k = P.mono ? 'm' : n.pitch;
        if (by[k] && by[k].start + by[k].dur > n.start) note('overlap', where + ' @' + n.start);
        by[k] = n;
      });
      try {
        var m = parseMidi(midiForPart(song, pid)), tr = m.tracks[0];
        if (m.format !== 0 || m.ntracks !== 1 || m.division !== PPQ || !tr.eot || tr.endTick !== total ||
            tr.noteOns !== notes.length || tr.noteOffs !== notes.length || tr.tempo !== Math.round(60000000 / cfg.bpm)) note('midi', where);
      } catch (err) { note('midi', where + ' ' + err.message); }
    });
    try {
      var c = parseMidi(midiCombined(song));
      if (c.format !== 1 || c.ntracks !== PART_IDS.length + 1 || c.division !== PPQ || c.tracks.some(function (t) { return !t.eot || t.endTick !== total; })) note('midi', label + '/combined');
    } catch (err2) { note('midi', label + '/combined ' + err2.message); }
    combos++;
  }

  // sweep: every genre x scale x bar length, cycling styles, keys and seeds
  var si = 0;
  GENRE_IDS.forEach(function (g) {
    Object.keys(SCALES).forEach(function (sc) {
      [4, 8, 16, 32].forEach(function (bars) {
        for (var k = 0; k < 5; k++, si++) {
          var styles = {};
          PART_IDS.forEach(function (pid) { var opts = ['auto'].concat(PARTS[pid].styles); styles[pid] = opts[(si + k * 3 + pid.length) % opts.length]; });
          var cfg = baseCfg({ genre: g, scale: sc, bars: bars, key: si % 12, seed: 'sweep' + si, styles: styles,
            bpm: GENRES[g].bpm[si % 2], swing: 50 + (si % 5) * 4, complexity: (si * 37) % 101, energy: (si * 53) % 101 });
          verify(generateSong(cfg), [g, sc, bars, si].join('-'));
        }
      });
    });
  });
  // every explicit style of every part in every genre
  GENRE_IDS.forEach(function (g) {
    PART_IDS.forEach(function (pid) {
      PARTS[pid].styles.forEach(function (st) {
        var styles = {}; styles[pid] = st;
        verify(generateSong(baseCfg({ genre: g, styles: styles, seed: g + pid + st, bpm: GENRES[g].bpm[0] })), g + '-' + st);
      });
    });
  });
  check('all parts generate notes (' + combos + ' songs)', bad.empty === 0, first.empty);
  check('notes are in the selected scale', bad.scale === 0, first.scale);
  check('pitch ranges and drum map respected', bad.range === 0, first.range);
  check('no note runs beyond the loop end', bad.loop === 0, first.loop);
  check('last bar is never empty (clip length is exact)', bad.lastBar === 0, first.lastBar);
  check('no overlapping notes of the same pitch', bad.overlap === 0, first.overlap);
  check('MIDI header/tracks valid and round-trip', bad.midi === 0, first.midi);

  // determinism + re-roll
  var a = generateSong(baseCfg({ seed: 'alpha' })), b = generateSong(baseCfg({ seed: 'alpha' })), c = generateSong(baseCfg({ seed: 'beta' }));
  check('same seed gives the same result', sig(a) === sig(b));
  check('different seed gives a different result', sig(a) !== sig(c));
  var v = generateSong(baseCfg({ seed: 'alpha', vars: { bass: 1 } }));
  check('regenerating one part leaves the others untouched',
    JSON.stringify(v.parts.bass.notes) !== JSON.stringify(a.parts.bass.notes) && JSON.stringify(v.parts.drums.notes) === JSON.stringify(a.parts.drums.notes));

  // kick stays quantized under full humanize; bass leaves room for the kick
  var k = generateSong(baseCfg({ swing: 50, humanize: 100, styles: { kick: 'ghost', bass: 'rolling' } }));
  check('kick stays quantized', k.parts.kick.notes.every(function (n) { return n.start % S16 === 0; }));
  var k2 = generateSong(baseCfg({ swing: 50, humanize: 0, styles: { bass: 'offbeat' } }));
  check('rolling/offbeat bass avoids kick hits',
    k.parts.bass.notes.every(function (n) { return n.start % PPQ > 60 && n.start % PPQ < PPQ - 15; }) &&
    k2.parts.bass.notes.every(function (n) { return n.start % PPQ !== 0; }));
  var k3 = generateSong(baseCfg({ humanize: 0, swing: 50, styles: { bass: 'synco' } }));
  check('bass plays the chord root on the downbeat', k3.parts.bass.notes.filter(function (n) { return n.start % BAR === 0; })
    .every(function (n) { return n.pitch % 12 === k3.ctx.chordAt(n.start).rootPc; }));
  var hum = generateSong(baseCfg({ humanize: 100, swing: 50 })), dry = generateSong(baseCfg({ humanize: 0, swing: 50 }));
  check('humanize stays within ±10 ticks / ±8 velocity', hum.parts.drums.notes.length === dry.parts.drums.notes.length &&
    hum.parts.drums.notes.every(function (n) { var d = ((n.start % 60) + 60) % 60; return Math.min(d, 60 - d) <= 10; }));

  // BPM ranges
  check('genre default BPM lies inside the genre range', GENRE_IDS.every(function (g) {
    var r = GENRES[g].bpm, mid = Math.round((r[0] + r[1]) / 2); return mid >= r[0] && mid <= r[1] && r[0] >= 110 && r[1] <= 140;
  }));
  check('artist preset BPM ranges lie inside their genre range', DEFAULT_ARTIST_PRESETS.every(function (p) {
    var r = GENRES[p.genre].bpm; return p.bpm[0] >= r[0] && p.bpm[1] <= r[1];
  }));
  check('library presets reference valid genres/artists/styles', LIBRARY.every(function (p) {
    return GENRES[p.genre] && SCALES[p.scale] && (!p.artist || DEFAULT_ARTIST_PRESETS.some(function (x) { return x.id === p.artist; })) &&
      Object.keys(p.styles || {}).every(function (pid) { return PARTS[pid].styles.indexOf(p.styles[pid]) >= 0; });
  }));
  // sound cards: 5-8 lines, no unfilled placeholders, genre-aware
  var cardsOk = true, cardSeen = {};
  GENRE_IDS.forEach(function (g) {
    PART_IDS.forEach(function (pid) {
      ['auto'].concat(PARTS[pid].styles).forEach(function (st) {
        var styles = {}; styles[pid] = st;
        var song = generateSong(baseCfg({ genre: g, styles: styles })), card = soundCard(pid, song.parts[pid], song);
        var text = JSON.stringify(card);
        if (card.lines.length < 5 || card.fx.length < 3 || !card.device || !card.deviceGuide || /\{\w+\}|undefined/.test(text) || !card.tags.length) cardsOk = false;
        if (st === PARTS[pid].styles[0]) { if (cardSeen[pid + text]) cardsOk = false; cardSeen[pid + text] = 1; }
      });
    });
  });
  check('sound-design cards complete and genre-specific', cardsOk);

  // key facts + chord editor
  var ki = keyInfo(11, 'min'), kj = keyInfo(2, 'major'), kf = keyInfo(5, 'min');
  check('key info: B minor <-> D major, flat keys spelled with flats',
    ki.relMajor === 'D major' && kj.relMinor === 'B minor' && ki.notes.join(' ') === 'B C# D E F# G A' && kf.notes.join(' ') === 'F G Ab Bb C Db Eb');
  var e0 = generateSong(baseCfg({ seed: 'edit', humanize: 0, swing: 50, styles: { bass: 'sub' } }));
  var e1 = generateSong(baseCfg({ seed: 'edit', humanize: 0, swing: 50, styles: { bass: 'sub' }, chordEdits: { 1: { deg: 4, ext: '7' }, 2: { deg: 6, tones: [5, 0, 2, 3] } } }));
  var okEdit = e1.ctx.slots[1].rootPc === 2 && e1.ctx.slots[1].name === 'Dm7' && e1.ctx.slots[2].ext === 'custom' && e1.ctx.slots[2].pcs.length === 4 &&
    e1.ctx.slots[0].name === e0.ctx.slots[0].name &&
    e1.parts.bass.notes.filter(function (n) { return n.start === e1.ctx.chords[1].start; })[0].pitch % 12 === 2;
  PART_IDS.forEach(function (pid) {
    if (!PARTS[pid].drum) e1.parts[pid].notes.forEach(function (n) { if (allowedPcs(9, 'min').indexOf(n.pitch % 12) < 0) okEdit = false; });
  });
  check('chord edits re-voice the chord and every part follows', okEdit);
  check('chord naming from notes', nameFromPcs(9, [9, 0, 4, 7], false) === 'Am7' && nameFromPcs(5, [5, 9, 0, 4, 7], false) === 'Fmaj9' && nameFromPcs(7, [7, 0, 2], false) === 'Gsus4');

  var passed = results.filter(function (r) { return r.ok; }).length;
  if (window.console) {
    if (console.table) console.table(results);
    console.log('runTests: ' + passed + '/' + results.length + ' passed');
    fails.forEach(function (f) { console.error('FAILED: ' + f); });
  }
  return { passed: passed, failed: results.length - passed, total: results.length, failures: fails };
}

/* =====================================================================
 * BOOT — the only globals are window.runTests and window.AnjunaMidiGen
 * ===================================================================== */
window.runTests = runTests;
window.AnjunaMidiGen = { generateSong: generateSong, midiForPart: midiForPart, midiCombined: midiCombined, parseMidi: parseMidi,
  soundCard: soundCard, GENRES: GENRES, DEFAULT_ARTIST_PRESETS: DEFAULT_ARTIST_PRESETS, LIBRARY: LIBRARY, STR: STR };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initUI); else initUI();
})();
</script>
</body>
